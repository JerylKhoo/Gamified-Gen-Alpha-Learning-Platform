name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -q test
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWKS_URI: ${{ secrets.SUPABASE_JWKS_URI }}

      - name: Trigger Render deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for Render deploy
        run: sleep 60

      - name: Smoke test — health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RENDER_URL }}/api/v1/health)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed — health check returned $STATUS"
            exit 1
          fi
          echo "Smoke test passed — service is UP"
